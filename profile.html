<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d1a" />
  <title>پروفایل · MeowBot</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="app">
    <h1 class="page-title">پروفایل</h1>
    <div class="card card-glow">
      <div class="avatar">🐱</div>
      <div class="profile-name" data-name>—</div>
      <div class="profile-id">ID: <span data-uid>—</span> · <span data-username>—</span></div>
      <div class="xp-bar"><div class="xp-fill" data-xp-bar></div></div>
      <p class="hint" style="text-align:center;margin-top:8px">XP <span data-xp>0</span> / <span data-xp-need>100</span></p>
    </div>
    <div class="card">
      <div class="row-stat"><span class="k">Level</span><span class="v" data-level>1</span></div>
      <div class="row-stat"><span class="k">سکه</span><span class="v" data-coins>0</span></div>
      <div class="row-stat"><span class="k">میوهای ثبت‌شده</span><span class="v" data-meows>0</span></div>
      <div class="row-stat"><span class="k">بازی‌ها</span><span class="v" data-games>0</span></div>
    </div>
    <p class="hint">نام و شناسه از محیط Mini App بله خوانده می‌شوند (فقط نمایش). احراز هویت واقعی باید در Backend با اعتبارسنجی initData انجام شود.</p>
  </div>
  <nav class="bottom-nav">
    <div class="inner">
      <a class="nav-item" href="index.html"><span class="ni">🏠</span>خانه</a>
      <a class="nav-item active" href="profile.html"><span class="ni">👤</span>پروفایل</a>
      <a class="nav-item" href="shop.html"><span class="ni">🛒</span>فروشگاه</a>
      <a class="nav-item" href="games.html"><span class="ni">🎮</span>بازی</a>
      <a class="nav-item" href="leaderboard.html"><span class="ni">🏅</span>رنک</a>
    </div>
  </nav>
  <script src="js/app.js"></script>
</body>
</html>
